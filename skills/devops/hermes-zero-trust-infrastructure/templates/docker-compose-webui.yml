version: "3.8"
services:
  webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: always
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8080
      - HERMES_CORS_ORIGINS=*
      - HERMES_API_URL=http://<TAILSCALE_IP>:8642
      - HERMES_WEBUI_STATE_DIR=/app/data
    ports:
      - "<TAILSCALE_IP>:8888:8080"
    volumes:
      - ./data:/app/data
      - /home/thaieasyvps/.hermes/hermes-agent:/home/hermeswebui/.hermes/hermes-agent:ro
    networks:
      - satang_network
volumes:
  webui_data:
networks:
  satang_network:
    external: true